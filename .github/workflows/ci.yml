name: KMS laboratory

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
      - name: Format, vet, race tests and build
        run: make check
      - name: Verify 1000 synthetic keys over mutual TLS
        run: make demo
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run isolated container laboratory
        run: make compose-demo
      - name: Remove laboratory containers and test credentials
        if: always()
        run: docker compose down -v
