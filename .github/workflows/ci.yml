name: KMS laboratory

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
      - name: Format, vet, race tests and build
        run: make check
      - name: Verify 1000 synthetic keys over mutual TLS
        run: make demo
      - name: Verify separate KMS processes, relay, multipath, failover and restart
        run: make relay-demo
      - name: Verify three-segment ingestion, independent CAs, KID preservation and restart
        run: make segmented-demo
      - name: Verify OGS pool bindings, SES input reporting and durable incident holds
        run: make federation-demo
      - name: Verify durable metadata, restricted views and signed two-site incident tracing
        run: make metadata-demo
      - name: Verify local allocation, controller isolation and pinned TeraFlow driver contract
        run: make sdn-demo
      - name: Verify two-KMS service lifecycle, telemetry and partial orchestration recovery
        run: make sdn-services-demo
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate captured 015 agent data against the published model
        run: |
          python -m pip install -r tests/sdn-requirements.txt
          python tests/validate_sdn_yang.py .local/sdn-node.json
          python tests/validate_sdn_yang.py .local/sdn-services-node.json
      - name: Check isolated TeraFlow deployment safety
        run: |
          python -m unittest discover -s tests -p test_teraflow_lab.py
          python -m unittest discover -s tests -p test_luxembourg_lab.py
          make services-deployment-test
          python -m py_compile deploy/teraflow/deploy-lab.py deploy/teraflow/check-cluster.py
          python -m py_compile deploy/luxembourg/deploy.py deploy/luxembourg/acceptance.py deploy/luxembourg/check.py
          for script in deploy/teraflow/bootstrap-ubuntu.sh deploy/teraflow/build-images.sh deploy/teraflow/run-acceptance.sh; do bash -n "$script"; done
          sh -n deploy/teraflow/start-kms.sh
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run isolated container laboratory
        run: make compose-demo
      - name: Remove laboratory containers and test credentials
        if: always()
        run: docker compose down -v
  operational:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install PostgreSQL test binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql libpq-dev softhsm2
      - name: PostgreSQL recovery, authorization and authenticated application sessions
        run: make operational-demo
      - name: PKCS11 non-exportable synthetic key wrapping and rotation
        run: KMS_TEST_PKCS11_MODULE=/usr/lib/softhsm/libsofthsm2.so go test -race -tags pkcs11 ./src/internal/wrapping
