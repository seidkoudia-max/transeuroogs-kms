    # Terms

    For the purposes of the present document, the terms given in ETSI GR QKD 007 [[GRQKD007](#ref_GRQKD007)] 
    and the following apply:
    
    NOTE: A term defined in the present document takes precedence over the definition of 
    the same term, if any, in ETSI GR QKD 007 [[GRQKD007](#ref_GRQKD007)].

    **interworking node:** node of more than one QKD network that contains key management entities 
    from each QKD network interworking within the node

    **key management entity:** entity that manages keys in a network in cooperation with one or 
    more other key management entities

    **secure application entity:** entity that requests one or more keys from a key management entity 
    for one or more applications running in cooperation with one or more other secure application entities

